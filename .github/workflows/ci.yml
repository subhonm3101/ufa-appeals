name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: "Бэкенд, миграции и тесты"
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: appeals
          POSTGRES_PASSWORD: appeals
          POSTGRES_DB: appeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appeals -d appeals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APPEALS_DATABASE_URL: postgresql+psycopg://appeals:appeals@127.0.0.1:5432/appeals_test
      APPEALS_TEST_DATABASE_URL: postgresql+psycopg://appeals:appeals@127.0.0.1:5432/appeals_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Миграции на пустой базе
        run: alembic upgrade head
      - name: Тесты
        run: python -m pytest -q

  frontend:
    name: "Интерфейс, сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
