
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ufa-appeals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appeals
      POSTGRES_PASSWORD: appeals
      POSTGRES_DB: appeals
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
